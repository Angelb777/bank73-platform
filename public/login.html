<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Bank73 — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/branding.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="/css/base.css?v=20260211" rel="stylesheet" />
  <link href="/css/theme.css?v=20260211" rel="stylesheet" />
  <link href="/css/brands.css?v=2" rel="stylesheet" />
  <link href="/css/login.css?v=7" rel="stylesheet" />

  <link rel="preload" as="image" href="/assets/TrustForBanksLogo.png" />
  <link rel="icon" type="image/png" href="/assets/TrustForBanksSimbol.png" />
</head>

<body class="bg-gradient bank73-login">
  <div class="login-wrap">
    <div class="brand-panel">
      <div class="brand-content">
        <img class="brand-logo" src="/assets/TrustForBanksLogo.png" alt="Bank73 logo" data-brand-logo="dark" />
        <p class="brand-subtitle">Control y seguimiento de proyectos inmobiliarios financiados.</p>

        <p class="brand-benefits-title">Una visión completa del proyecto para:</p>

        <div class="brand-kpis">
          <div class="kpi-pill">Reducir riesgos</div>
          <div class="kpi-pill">Ahorrar tiempo operativo</div>
          <div class="kpi-pill">Acelerar la ejecución</div>
          <div class="kpi-pill">Proteger el valor de la garantía</div>
        </div>

        <footer class="brand-footer">
          <small>© <span id="y"></span> Bank73</small>
        </footer>
      </div>
    </div>

    <main class="login-card glass">
      <header class="login-header">
        <h2>Bienvenido</h2>
        <p class="muted">Inicia sesión para continuar</p>
      </header>

      <form id="loginForm" class="login-form">
        <label>Email</label>
        <input type="email" id="email" placeholder="exec@banco.com" required />

        <label>Contraseña</label>
        <div class="input-with-action">
          <input type="password" id="password" placeholder="secret" required />
          <button
            type="button"
            class="ghost small"
            id="togglePwd"
            aria-label="Mostrar contraseña"
          >👁️</button>
        </div>

        <button type="submit" class="btn primary stretch" id="submitBtn">
          Entrar
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="login-meta">
        <div id="msg" class="msg"></div>
        <p class="small">
          ¿No tienes cuenta?
          <a class="link" href="/register">Crear una cuenta</a>
        </p>
      </div>
    </main>
  </div>

  <script src="/js/api.js?v=20260211"></script>
  <script src="/js/login-ui.js?v=20260211"></script>
  <script src="/js/auth.js?v=20260211"></script>
</body>
</html>
